<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nosh 注文用メニューカタログ</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--text:#222;--muted:#777;--line:#ddd;--accent:#2f8f5b;--hot:#e53935}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;box-shadow:0 2px 8px #00000010}
h1{font-size:22px;margin:0 0 10px}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,minmax(120px,160px));gap:8px}
input,select,button{font:inherit;border:1px solid #ccc;border-radius:8px;padding:9px 10px;background:#fff}
.summary{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.badge{background:#eef7f1;border:1px solid #cfe7d8;border-radius:999px;padding:7px 12px;font-weight:600}
button{cursor:pointer}
button.active{background:#e9f4ed;border-color:#8cc8a4}
main{padding:18px}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{border-bottom:1px solid #eee;padding:8px 10px;vertical-align:middle}
th{position:sticky;top:0;background:#fafafa;text-align:left;z-index:5}
tr:hover{background:#fafdfb}
.photo{width:100px;height:74px;object-fit:cover;border-radius:7px;display:block}
.name{font-weight:600;min-width:260px}
.center{text-align:center}
.price{font-weight:700;white-space:nowrap}
.fee{font-size:12px;color:#a66b00}
.spice{color:var(--hot);font-weight:700;letter-spacing:1px}
.order{width:20px;height:20px}.qty{min-width:68px;padding:6px}
.fav{font-size:21px;border:0;background:transparent;padding:0;color:#aaa}
.fav.on{color:#e44}
@media(max-width:800px){
 header{position:static}.controls{grid-template-columns:1fr 1fr}
 main{padding:10px}
 .table-wrap{border:0;border-radius:0}
 table{min-width:0}
 thead{display:none}
 tr{display:grid;grid-template-columns:92px 1fr;gap:2px 10px;padding:10px;border-bottom:1px solid #ddd}
 td{border:0;padding:2px}
 td.photo-cell{grid-row:span 4}
 td.hide-mobile{display:none}
 .name{min-width:0;font-size:15px}
}
</style>
</head>
<body>
<header>
<h1>🍱 nosh 注文用メニューカタログ</h1>
<div class="controls">
<input id="q" placeholder="🔍 メニュー名を検索">
<select id="cat"><option value="">カテゴリ：すべて</option></select>
<select id="sp"><option value="">辛さ：すべて</option><option value="0">0（辛くない）</option><option value="1">1</option><option value="2">2</option><option value="3">3（辛い）</option></select>
<select id="fee"><option value="">料金：すべて</option><option value="0">通常</option><option value="130">+¥130</option><option value="250">+¥250</option><option value="350">+¥350</option><option value="500">+¥500</option></select>
<select id="sort"><option value="default">並び順：元の順番</option><option value="price">価格が安い順</option><option value="carb">糖質が少ない順</option><option value="rating">評価が高い順</option><option value="spice">辛さが少ない順</option></select>
</div>
<div class="summary">
<span class="badge">注文 <span id="count">0</span> / 20食</span>
<span class="badge">合計 <span id="total">¥0</span></span>
<button id="showOrder">注文候補だけ表示</button>
<button id="clear">選択をクリア</button>
</div>
</header>
<main>

<table>

<tbody id="body"></tbody>
</table>
</div>

const state=JSON.parse(localStorage.getItem("noshOrderState")||"{}");
const quantities=state.quantities||{};
const favs=new Set(state.favs||[]);
let orderOnly=false;
const yen=n=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n);
function save(){localStorage.setItem("noshOrderState",JSON.stringify({quantities,favs:[...favs]}))}
function fillCats(){
 const cats=[...new Set(menus.map(x=>x.category))];
 cat.innerHTML='<option value="">カテゴリ：すべて</option>'+cats.map(x=>`<option>${x}</option>`).join("");
}
function filtered(){
 const qv=q.value.trim().toLowerCase(), cv=cat.value, sv=sp.value, fv=fee.value, sortv=sort.value;
 let a=menus.map((x,i)=>({...x,idx:i})).filter(x=>
   (!qv||x.name.toLowerCase().includes(qv)) &&
   (!cv||x.category===cv) &&
   (sv===""||String(x.spice)===sv) &&
   (fv===""||String(x.fee)===fv) &&
   (!orderOnly||Number(quantities[x.idx]||0)>0)
 );
 if(sortv==="price")a.sort((a,b)=>a.price-b.price);
 if(sortv==="carb")a.sort((a,b)=>(a.carb??999)-(b.carb??999));
 if(sortv==="rating")a.sort((a,b)=>(b.rating??-1)-(a.rating??-1));
 if(sortv==="spice")a.sort((a,b)=>a.spice-b.spice);
 return a;
}
function render(){
 const a=filtered();
 body.innerHTML=a.map(x=>{
   const qty=Number(quantities[x.idx]||0), fav=favs.has(x.idx);
   const img=x.img?`<img class="photo" src="${x.img}" alt="">`:"";
   return `<tr>
   <td class="center">${x.idx+1}</td><td class="photo-cell">${img}</td>
   <td class="name">${escapeHtml(x.name)}</td>
   <td class="hide-mobile">${escapeHtml(x.category)}</td>
   <td>${x.carb==null?"—":x.carb+"g"}</td>
   <td class="spice">${"🌶️".repeat(x.spice)||"—"}</td>
   <td>⭐${x.ratingText}</td>
   <td class="price">${yen(x.price)}<div class="fee">${x.feeLabel}</div></td>
   <td><button class="fav ${fav?"on":""}" data-fav="${x.idx}">♥</button></td>
   <td class="center"><select class="qty" data-qty="${x.idx}" aria-label="数量">
      ${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${qty===n?"selected":""}>${n===0?"—":n+"個"}</option>`).join("")}
   </select></td>
   </tr>`
 }).join("");
 document.querySelectorAll("[data-qty]").forEach(el=>el.onchange=()=>{
   const i=+el.dataset.qty;
   const n=+el.value;
   if(n>0) quantities[i]=n; else delete quantities[i];
   save(); updateSummary(); if(orderOnly)render();
 });
 document.querySelectorAll("[data-fav]").forEach(el=>el.onclick=()=>{
   const i=+el.dataset.fav;
   if(favs.has(i))favs.delete(i);else favs.add(i);
   save();render();
 });
 updateSummary();
}
function updateSummary(){
 let units=0,total=0;
 Object.keys(quantities).forEach(k=>{
   const i=+k,n=Number(quantities[k]||0);
   units+=n; total+=menus[i].price*n;
 });
 count.textContent=units; totalEl=total;
 document.getElementById("total").textContent=yen(total);
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
[q,cat,sp,fee,sort].forEach(el=>el.addEventListener("input",render));
showOrder.onclick=()=>{orderOnly=!orderOnly;showOrder.classList.toggle("active",orderOnly);showOrder.textContent=orderOnly?"全メニューを表示":"注文候補だけ表示";render()};
clear.onclick=()=>{for(const k of Object.keys(quantities)) delete quantities[k];save();render()};
fillCats();render();
</script>
